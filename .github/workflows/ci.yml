name: PHP CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, dom, curl, fileinfo, gd
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Lint every tracked PHP file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z -- '*.php')

      - name: Check every tracked JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z -- '*.js')

      - name: Check forbidden tracked artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files -- '.phpunit.result.cache')"
          test -z "$(git ls-files -- 'vendor/*')"

      - name: Run PHPUnit
        run: vendor/bin/phpunit --do-not-record-test-run-history --display-deprecations --display-phpunit-deprecations
