name: PHP CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, dom, curl, fileinfo, gd
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint changed PHP entry points
        run: |
          php -l dashboard.php
          php -l includes/dashboard_context.php
          php -l includes/partials/dashboard/dashboard_get_started.php
          php -l includes/partials/dashboard/dashboard_stats.php
          php -l includes/partials/dashboard/dashboard_chart.php
          php -l includes/partials/dashboard/dashboard_recent_orders.php
          php -l includes/partials/dashboard/dashboard_quick_actions.php
          php -l includes/partials/dashboard/dashboard_top_selling.php

      - name: Run PHPUnit
        run: vendor/bin/phpunit
