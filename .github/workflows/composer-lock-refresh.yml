name: Refresh Composer Lockfile

on:
  push:
    branches: [main]
    paths:
      - "composer.json"
      - ".github/workflows/composer-lock-refresh.yml"

permissions:
  contents: write

concurrency:
  group: swiftorder-composer-lock-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, mbstring, mysqli, xml
          coverage: none
          tools: composer:v2

      - name: Resolve patched development dependencies
        run: composer update phpunit/phpunit --with-dependencies --no-install --no-interaction --no-progress

      - name: Commit refreshed lockfile to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.lock; then
            echo "Composer lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Update Composer lockfile"
          git push origin HEAD:main
