name: SwiftOrder QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: swiftorder-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP syntax, dependencies and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, mbstring, mysqli, xml
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z '*.php' | tr '\0' '\n' | while IFS= read -r file; do printf '%s\0' "$file"; done)

      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml

      - name: Composer vulnerability audit
        run: composer audit --locked --no-interaction

  javascript-quality:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tracked JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z '*.js')

  static-security:
    name: Static security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep security rules
        uses: semgrep/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/security-audit
            p/php

      - name: Upload Semgrep SARIF when generated
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

