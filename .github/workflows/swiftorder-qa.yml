name: SwiftOrder QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: swiftorder-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP syntax, dependencies and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, mbstring, mysqli, xml
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(git ls-files -z '*.php' | tr '\0' '\n' | while IFS= read -r file; do printf '%s\0' "$file"; done)

      - name: PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml --display-phpunit-deprecations

      - name: Composer vulnerability audit
        run: composer audit --locked --no-interaction

  database-compatibility:
    name: Database schema compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [mysql:8.4, mariadb:11.4]
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: swiftorder-ci-root
          MARIADB_ROOT_PASSWORD: swiftorder-ci-root
        ports:
          - 3306:3306
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MySQL-compatible client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Install and compare clean schema and initial migration
        env:
          MYSQL_ROOT_PASSWORD: swiftorder-ci-root
        run: bash tests/database/schema-compatibility.sh

  javascript-quality:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tracked JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(git ls-files -z '*.js')

  static-security:
    name: Static security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install semgrep

      - name: Run PHP and application security rules
        run: |
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --metrics=off \
            --config p/security-audit \
            --config p/php \
            --sarif \
            --output semgrep.sarif

      - name: Upload Semgrep findings to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
